<!DOCTYPE html>
<html>
<body>

<h2>AJAX Example</h2>

<button onclick="loadData()">Load Data</button>

<p id="demo"></p>

<script>
function loadData()
{
    var x = new XMLHttpRequest();

    x.open("GET", "data.txt", true);

    x.onload = function()
    {
        document.getElementById("demo").innerHTML =
            x.responseText;
    };

    x.send();
}
</script>

</body>
</html>
